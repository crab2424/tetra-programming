<!DOCTYPE html>
<html lang="ja">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>テトリス</title>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap');

        :root {
          --bg: #0a0a0f;
          --panel-bg: #12121a;
          --border: #2a2a3a;
          --accent: #c471f5;
          --accent2: #fa71cd;
          --accent3: #71c5f5;
          --text: #e0e0f0;
          --text-dim: #888;
          --danger: #f55a5a;
          --success: #5af5a0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          background: var(--bg);
          color: var(--text);
          font-family: 'Noto Sans JP', sans-serif;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 24px 16px;
        }

        h1 {
          font-family: 'Orbitron', monospace;
          font-size: 28px;
          font-weight: 900;
          letter-spacing: 6px;
          background: linear-gradient(90deg, var(--accent), var(--accent2));
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          margin-bottom: 20px;
          text-transform: uppercase;
        }

        /* ─── タブ ─── */
        #tabs {
          display: flex;
          gap: 4px;
          margin-bottom: 16px;
          background: var(--panel-bg);
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 4px;
        }

        .tab-btn {
          font-family: 'Orbitron', monospace;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 2px;
          padding: 8px 24px;
          border: none;
          border-radius: 5px;
          background: transparent;
          color: var(--text-dim);
          cursor: pointer;
          transition: all 0.2s;
        }

        .tab-btn.active {
          background: linear-gradient(135deg, var(--accent), var(--accent2));
          color: #fff;
        }

        .tab-btn:hover:not(.active) {
          color: var(--text);
          background: rgba(255,255,255,0.05);
        }

        /* ─── ページ ─── */
        .page { display: none; }
        .page.active { display: block; }

        /* ─── ゲームページ ─── */
        #game-page {
          position: relative;
          width: 700px;
        }

        #container {
          position: relative;
          width: 700px;
          height: 640px;
        }

        canvas {
          image-rendering: pixelated;
        }

        #main-canvas {
          border: 2px solid var(--border);
          border-radius: 2px;
          box-shadow: 0 0 24px rgba(196, 113, 245, 0.2);
        }

        #next-canvas, #hold-canvas {
          position: absolute;
          border: 2px solid var(--border);
          border-radius: 2px;
        }

        #next-canvas { top: 0; left: 400px; }
        #hold-canvas { top: 200px; left: 400px; }

        .area-label {
          position: absolute;
          left: 400px;
          font-family: 'Orbitron', monospace;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 3px;
          color: var(--text-dim);
        }

        #label-next { top: -18px; }
        #label-hold { top: 182px; }

        #score-area {
          position: absolute;
          left: 400px;
          top: 390px;
          font-family: sans-serif;
        }

        #score-area .area-label {
          position: static;
          display: block;
          margin-bottom: 4px;
        }

        #score-value {
          font-family: 'Orbitron', monospace;
          font-size: 30px;
          font-weight: 700;
          background: linear-gradient(90deg, var(--accent3), var(--accent));
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        #img-howto {
          position: absolute;
          bottom: 200px;
          left: 360px;
          opacity: 0.6;
        }

        #start-btn {
          position: absolute;
          left: 400px;
          bottom: 0;
          width: 180px;
          text-align: center;
          font-family: 'Orbitron', monospace;
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 2px;
          color: #fff;
          border: none;
          border-radius: 6px;
          padding: 14px 24px;
          background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
          cursor: pointer;
          transition: opacity 0.2s, transform 0.1s;
        }

        #start-btn:hover { opacity: 0.88; transform: translateY(-1px); }
        #start-btn:active { transform: translateY(0); }

        /* ─── 設定ページ ─── */
        #settings-page {
          width: 700px;
          background: var(--panel-bg);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 32px;
        }

        #settings-page h2 {
          font-family: 'Orbitron', monospace;
          font-size: 14px;
          letter-spacing: 4px;
          color: var(--text-dim);
          margin-bottom: 28px;
          text-transform: uppercase;
        }

        .key-config-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 12px;
          margin-bottom: 28px;
        }

        .key-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: rgba(255,255,255,0.03);
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 12px 16px;
          gap: 12px;
        }

        .key-action-name {
          font-size: 13px;
          color: var(--text);
          flex: 1;
          font-weight: 700;
        }

        .key-action-name small {
          display: block;
          font-size: 11px;
          color: var(--text-dim);
          font-weight: 400;
          margin-top: 2px;
        }

        .key-badge {
          font-family: 'Orbitron', monospace;
          font-size: 11px;
          font-weight: 700;
          padding: 6px 12px;
          border-radius: 5px;
          background: rgba(196, 113, 245, 0.15);
          border: 1px solid rgba(196, 113, 245, 0.35);
          color: var(--accent);
          min-width: 80px;
          text-align: center;
          white-space: nowrap;
          cursor: pointer;
          transition: all 0.2s;
          user-select: none;
        }

        .key-badge:hover {
          background: rgba(196, 113, 245, 0.28);
        }

        .key-badge.listening {
          background: rgba(250, 113, 205, 0.2);
          border-color: var(--accent2);
          color: var(--accent2);
          animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }

        .settings-actions {
          display: flex;
          gap: 12px;
          justify-content: flex-end;
        }

        .btn {
          font-family: 'Orbitron', monospace;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 2px;
          padding: 10px 24px;
          border-radius: 6px;
          border: none;
          cursor: pointer;
          transition: all 0.2s;
        }

        .btn-reset {
          background: transparent;
          border: 1px solid var(--border);
          color: var(--text-dim);
        }

        .btn-reset:hover { border-color: var(--danger); color: var(--danger); }

        .btn-save {
          background: linear-gradient(135deg, var(--accent), var(--accent2));
          color: #fff;
        }

        .btn-save:hover { opacity: 0.85; }

        #settings-toast {
          position: fixed;
          bottom: 32px;
          left: 50%;
          transform: translateX(-50%) translateY(20px);
          background: var(--success);
          color: #0a0a0f;
          font-family: 'Orbitron', monospace;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 2px;
          padding: 10px 28px;
          border-radius: 100px;
          opacity: 0;
          transition: opacity 0.3s, transform 0.3s;
          pointer-events: none;
          z-index: 999;
        }

        #settings-toast.show {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }

        /* ─── conflict warning ─── */
        .conflict-warning {
          font-size: 11px;
          color: var(--danger);
          margin-top: -8px;
          margin-bottom: 8px;
          display: none;
        }
        .conflict-warning.show { display: block; }
      </style>
  </head>
  <body>
    <h1>TETRIS</h1>

    <div id="tabs">
      <button class="tab-btn active" onclick="switchTab('game')">▶ GAME</button>
      <button class="tab-btn" onclick="switchTab('settings')">⚙ SETTINGS</button>
    </div>

    <!-- ゲームページ -->
    <div id="game-page" class="page active">
      <div id="container">
        <canvas id="main-canvas"></canvas>
        <span class="area-label" id="label-next">NEXT</span>
        <canvas id="next-canvas"></canvas>
        <span class="area-label" id="label-hold">HOLD</span>
        <canvas id="hold-canvas"></canvas>
        <div id="score-area">
          <span class="area-label">SCORE</span>
          <span id="score-value">0</span>
        </div>
        <img id="img-howto" src="images/howto.png">
        <button id="start-btn">START</button>
      </div>
    </div>

    <!-- 設定ページ -->
    <div id="settings-page" class="page">
      <h2>⚙ KEY CONFIG</h2>
      <div class="key-config-grid" id="key-config-grid">
        <!-- JS で生成 -->
      </div>
      <p class="conflict-warning" id="conflict-warning">⚠ 同じキーが複数のアクションに割り当てられています</p>
      <div class="settings-actions">
        <button class="btn btn-reset" onclick="resetToDefaults()">RESET DEFAULT</button>
        <button class="btn btn-save" onclick="saveSettings()">SAVE</button>
      </div>
    </div>

    <div id="settings-toast">SAVED ✓</div>

    <script src="tetris.js"></script>
    <script>
      // ─── タブ切り替え ───
      function switchTab(tab) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tab + '-page').classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(b => {
          if(b.textContent.toLowerCase().includes(tab === 'game' ? 'game' : 'set')) b.classList.add('active');
        });
        // 設定ページに入ったらリッスン中をリセット
        stopListening();
        renderKeyConfig();
      }

      // ─── デフォルトキー設定 ───
      const DEFAULT_KEYS = {
        moveLeft:    { code: 'ArrowLeft',  label: '←' },
        moveRight:   { code: 'ArrowRight', label: '→' },
        softDrop:    { code: 'ArrowDown',  label: '↓' },
        hardDrop:    { code: 'Space',      label: 'SPACE' },
        rotateCW:    { code: 'ArrowUp',    label: '↑' },
        rotateCCW:   { code: 'KeyZ',       label: 'Z' },
        hold:        { code: 'ShiftLeft',  label: 'SHIFT' },
      };

      const ACTION_LABELS = {
        moveLeft:   { name: '左移動',     en: 'Move Left' },
        moveRight:  { name: '右移動',     en: 'Move Right' },
        softDrop:   { name: 'ソフトドロップ', en: 'Soft Drop' },
        hardDrop:   { name: 'ハードドロップ', en: 'Hard Drop' },
        rotateCW:   { name: '右回転',     en: 'Rotate CW' },
        rotateCCW:  { name: '左回転',     en: 'Rotate CCW' },
        hold:       { name: 'ホールド',   en: 'Hold' },
      };

      // ─── 現在のキー設定（localStorage から読み込み）───
      function loadKeys() {
        try {
          const saved = localStorage.getItem('tetris_keyconfig');
          if(saved) return JSON.parse(saved);
        } catch(e) {}
        return JSON.parse(JSON.stringify(DEFAULT_KEYS));
      }

      let currentKeys = loadKeys();
      let listeningAction = null;
      let _onKeyDown = null;

      // ─── UI 描画 ───
      function renderKeyConfig() {
        const grid = document.getElementById('key-config-grid');
        grid.innerHTML = '';
        for(const action in ACTION_LABELS) {
          const info = ACTION_LABELS[action];
          const keyInfo = currentKeys[action];
          const row = document.createElement('div');
          row.className = 'key-row';
          row.innerHTML = `
            <div class="key-action-name">
              ${info.name}
              <small>${info.en}</small>
            </div>
            <div class="key-badge" id="badge-${action}" onclick="startListening('${action}')">
              ${keyInfo.label}
            </div>
          `;
          grid.appendChild(row);
        }
        checkConflicts();
      }

      // ─── キー入力待ち ───
      function startListening(action) {
        stopListening();
        listeningAction = action;
        const badge = document.getElementById('badge-' + action);
        badge.classList.add('listening');
        badge.textContent = '...';

        _onKeyDown = function(e) {
          e.preventDefault();
          const label = getKeyLabel(e);
          currentKeys[action] = { code: e.code, label };
          stopListening();
          renderKeyConfig();
        };
        document.addEventListener('keydown', _onKeyDown);
      }

      function stopListening() {
        if(_onKeyDown) {
          document.removeEventListener('keydown', _onKeyDown);
          _onKeyDown = null;
        }
        if(listeningAction) {
          const badge = document.getElementById('badge-' + listeningAction);
          if(badge) badge.classList.remove('listening');
          listeningAction = null;
        }
      }

      function getKeyLabel(e) {
        const specialMap = {
          'Space': 'SPACE', 'ArrowLeft': '←', 'ArrowRight': '→',
          'ArrowUp': '↑', 'ArrowDown': '↓',
          'ShiftLeft': 'L-SHIFT', 'ShiftRight': 'R-SHIFT',
          'ControlLeft': 'L-CTRL', 'ControlRight': 'R-CTRL',
          'AltLeft': 'L-ALT', 'AltRight': 'R-ALT',
          'Enter': 'ENTER', 'Backspace': 'BS', 'Tab': 'TAB',
          'Escape': 'ESC',
        };
        if(specialMap[e.code]) return specialMap[e.code];
        if(e.key.length === 1) return e.key.toUpperCase();
        return e.code.replace('Key','').replace('Digit','');
      }

      // ─── コンフリクト検出 ───
      function checkConflicts() {
        const codes = Object.values(currentKeys).map(k => k.code);
        const hasDup = codes.length !== new Set(codes).size;
        const warn = document.getElementById('conflict-warning');
        warn.classList.toggle('show', hasDup);

        // 重複しているバッジを赤く
        const count = {};
        codes.forEach(c => count[c] = (count[c]||0)+1);
        for(const action in currentKeys) {
          const badge = document.getElementById('badge-' + action);
          if(badge) {
            badge.style.borderColor = count[currentKeys[action].code] > 1
              ? 'var(--danger)' : '';
            badge.style.color = count[currentKeys[action].code] > 1
              ? 'var(--danger)' : '';
          }
        }
        return hasDup;
      }

      // ─── 保存 ───
      function saveSettings() {
        localStorage.setItem('tetris_keyconfig', JSON.stringify(currentKeys));
        // ゲームが動いていれば反映（setKeyEvent を再呼び出し）
        if(window._game) window._game.setKeyEvent();
        showToast();
      }

      // ─── デフォルトに戻す ───
      function resetToDefaults() {
        currentKeys = JSON.parse(JSON.stringify(DEFAULT_KEYS));
        renderKeyConfig();
      }

      // ─── トースト ───
      function showToast() {
        const t = document.getElementById('settings-toast');
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
      }

      // ─── 初回レンダリング ───
      renderKeyConfig();
    </script>
  </body>
</html>
