<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テトラボ</title>
    <link rel="stylesheet" href="style.css?v=4">
  </head>
  <body>
    <div id="header-area">
      <h1>TETLABO</h1>
    </div>

    <div id="game-page" class="page active">
      <div id="container">
        <canvas id="main-canvas"></canvas>
        <span class="area-label" id="label-next">NEXT</span>
        <canvas id="next-canvas"></canvas>
        <span class="area-label" id="label-hold">HOLD</span>
        <canvas id="hold-canvas"></canvas>
        <div id="score-area">
          <span class="area-label">SCORE</span>
          <span id="score-value">0</span>
        </div>
        <div id="time-area">
          <span class="area-label">TIME</span>
          <span id="time-value">00:00.00</span>
        </div>
        <button id="start-btn">START</button>
      </div>

      <div id="pause-overlay">
        <div id="pause-modal">
          <h2 id="pause-title">PAUSE</h2>
          <div id="pause-buttons">
            <button class="pause-btn btn-resume" onclick="window._game && window._game.resume()">▶ RESUME</button>
            <button class="pause-btn btn-settings" onclick="switchPage('settings')">⚙ SETTINGS</button>
            <button class="pause-btn btn-restart" onclick="window._game && window._game.start()">↺ RESTART</button>
          </div>
        </div>
      </div>
    </div>

    <div id="settings-page" class="page">
      <div class="settings-header">
        <h2 style="margin-bottom: 0;">⚙ KEY CONFIG</h2>
        <button class="btn btn-back" onclick="switchPage('game')">◀ BACK TO GAME</button>
      </div>
      
      <div class="key-config-grid" id="key-config-grid">
        </div>
      <p class="conflict-warning" id="conflict-warning">
        ⚠ 同じキーが複数のアクションに割り当てられています
      </p>

      <h2 style="margin-top: 32px; margin-bottom: 28px;">🛠 TUNING</h2>
      <div class="tuning-container">
        <div class="slider-row">
          <div class="slider-label">DAS <small>(Delayed Auto Shift)</small><span id="val-das">9.0f (150ms)</span></div>
          <input type="range" id="slider-das" min="0" max="30" step="0.1" value="9.0">
          <div class="slider-markers"><span>0f</span><span>10f</span><span>20f</span><span>30f</span></div>
        </div>
        <div class="slider-row">
          <div class="slider-label">ARR <small>(Auto Repeat Rate)</small><span id="val-arr">1.1f (18ms)</span></div>
          <input type="range" id="slider-arr" min="0" max="10" step="0.1" value="1.1">
          <div class="slider-markers"><span>0f</span><span>5f</span><span>10f</span></div>
        </div>
        <div class="slider-row">
          <div class="slider-label">DCD <small>(DAS Cut Delay)</small><span id="val-dcd">3.0f (50ms)</span></div>
          <input type="range" id="slider-dcd" min="0" max="10" step="0.1" value="3.0">
          <div class="slider-markers"><span>0f</span><span>5f</span><span>10f</span></div>
        </div>
      </div>

      <div class="settings-actions" style="margin-top: 24px;">
        <button class="btn btn-reset" onclick="resetToDefaults()">RESET DEFAULT</button>
        <button class="btn btn-save"  onclick="saveSettings()">SAVE</button>
      </div>
    </div>

    <div id="settings-toast">SAVED ✓</div>

    <script src="game.js?v=4"></script>
    <script src="settings.js?v=4"></script>
  </body>
</html>
